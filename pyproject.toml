[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guacamole-mcp"
version = "0.1.0"
description = "MCP server for the Apache Guacamole REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andhitia Rama", email = "andhitia.r@gmail.com" }]
keywords = ["mcp", "guacamole", "apache", "remote-desktop", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]
integration = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-docker>=3.1",
    "httpx>=0.27",
    "fastmcp>=2.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
]

[project.scripts]
guacamole-mcp = "guacamole_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/andhit-r/apache-guacamole-mcp"
Documentation = "https://apache-guacamole-mcp.readthedocs.io"
Repository = "https://github.com/andhit-r/apache-guacamole-mcp"
"Bug Tracker" = "https://github.com/andhit-r/apache-guacamole-mcp/issues"
Changelog = "https://github.com/andhit-r/apache-guacamole-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/guacamole_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require Docker)",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
